<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlexiaAlert TV</title>
<style>
:root { --bg:#0a0e14; --panel:#111820; --border:#1e2a3a; --accent:#00d4ff; --red:#ff3b3b; --text:#e2e8f0; --dim:#8899aa; --gap:4px; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif; cursor:none; }
body { display:grid; grid-template-rows:auto 1fr; }
.bar { display:flex; align-items:center; gap:16px; padding:0 20px; height:7vh; min-height:44px; background:var(--panel); border-bottom:1px solid var(--border); }
.logo { font-weight:800; letter-spacing:1px; color:var(--accent); font-size:2.4vh; white-space:nowrap; }
.live { color:var(--red); font-weight:700; font-size:1.8vh; display:flex; align-items:center; gap:6px; }
.live i { width:1vh; height:1vh; border-radius:50%; background:var(--red); animation:p 1.5s infinite; }
@keyframes p { 50% { opacity:.3; } }
.cat { color:#ffaa00; font-weight:700; font-size:1.9vh; white-space:nowrap; }
.sp { flex:1; }
.clock { font-size:2.3vh; font-variant-numeric:tabular-nums; color:var(--dim); white-space:nowrap; }
.ticker { grid-column:1 / -1; height:5.2vh; min-height:30px; line-height:5.2vh; background:#2a0d12; border-bottom:2px solid var(--red); color:#ff6b6b; font-weight:800; font-size:2.4vh; letter-spacing:.5px; overflow:hidden; white-space:nowrap; }
.ticker span { display:inline-block; padding-left:100%; animation:scroll 60s linear infinite; }
@keyframes scroll { to { transform:translateX(-100%); } }
.top { display:grid; grid-template-rows:auto auto; }
main { display:grid; grid-template-columns:2fr 1fr; gap:var(--gap); padding:var(--gap); min-height:0; }
.cams { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:var(--gap); min-height:0; }
.tile, .radar { position:relative; background:#000; border:1px solid var(--border); border-radius:6px; overflow:hidden; min-height:0; }
.cam-feed { position:absolute; inset:0; }
.tile iframe { position:absolute; inset:0; width:100%; height:100%; border:0; pointer-events:none; }
.label { position:absolute; left:0; right:0; bottom:0; padding:2.2vh 10px 6px; font-size:1.7vh; font-weight:700; background:linear-gradient(transparent,rgba(0,0,0,.85)); z-index:2; }
.radars { display:grid; grid-template-rows:repeat(3,1fr); gap:var(--gap); min-height:0; }
.radar img { width:100%; height:100%; object-fit:cover; display:block; background:#000; }
.radar .label { background:linear-gradient(transparent,rgba(0,0,0,.9)); }
.radar .age { position:absolute; top:6px; right:8px; z-index:2; font-size:1.4vh; color:#fff; background:rgba(0,0,0,.6); padding:2px 6px; border-radius:4px; }
.start { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(10,14,20,.94); text-align:center; padding:24px; cursor:pointer; }
.start.show { display:flex; }
.start b { font-size:22px; color:var(--accent); }
.start span { font-size:15px; color:var(--dim); max-width:420px; line-height:1.5; }
.start button { font-size:18px; font-weight:700; padding:14px 28px; border-radius:30px; border:0; background:var(--accent); color:#001; }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="logo">🌀 ALEXIAALERT</div>
    <div class="live"><i></i> LIVE</div>
    <div class="cat" id="cat">LOADING…</div>
    <div class="sp"></div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="ticker"><span id="tick">LOADING LATEST STORM INFORMATION…</span></div>
</div>
<main>
  <section class="cams" id="cams"></section>
  <section class="radars" id="radars"></section>
</main>
<div class="start" id="start">
  <b>🌀 AlexiaAlert TV</b>
  <button>Tap to go full screen</button>
  <span id="startHelp"></span>
</div>
<script src="cameras.js"></script>
<script src="tv.js"></script>
</body>
</html>
